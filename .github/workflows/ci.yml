name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting & Testing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit pyyaml

    - name: Run Python Linting (flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Python Security Scan (bandit)
      run: |
        # Run security check on planner script
        bandit -r openshift_upgrade_planner.py

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s . -p "test_*.py"
